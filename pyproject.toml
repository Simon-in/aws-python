[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-python-utils"
version = "1.1.0"
authors = [
  { name = "AWS Python Project", email = "" },
]
description = "AWS 云服务集成工具包，提供丰富的模块和工具用于处理云数据集成、ETL 任务和自动化操作"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "simple-salesforce>=1.12.5",
    "snowflake-connector-python>=3.6.0",
    "pytz>=2023.3",
    "requests>=2.31.0",
    "tenacity>=8.2.3",
    "msal>=1.28.0",
    "pandas>=2.0.0",
    "azure-core>=1.29.0",
    "azure-storage-blob>=12.19.0",
    "numpy>=1.24.0",
    "python-dateutil>=2.8.2",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "PyYAML>=6.0",
    "typing-extensions>=4.7.0",
    "pyodbc>=4.0.39",
    "mysql-connector-python>=8.1.0",
    "psycopg2-binary>=2.9.6",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://github.com/your-username/aws-python"
Repository = "https://github.com/your-username/aws-python"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
(\.git|
\.hg|
\.mypy_cache|
\.tox|
\.venv|
_build|
buck-out|
build|
dist)
'''

[tool.isort]
profile = "black"
line_length = 88
